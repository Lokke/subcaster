version: '3.8'

services:
  subcaster:
    image: ghcr.io/lokke/subcaster:latest
    container_name: subcaster
    restart: unless-stopped
    ports:
      - "3002:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DOCKER_ENV=true
    volumes:
      - ./docker-data:/app/docker-data
    labels:
      # Watchtower wird diesen Container automatisch updaten
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Watchtower - Automatisches Update-System
  watchtower:
    image: containrrr/watchtower:latest
    container_name: subcaster-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/config.json:ro
    environment:
      # Prüfe alle 5 Minuten auf neue Images
      - WATCHTOWER_POLL_INTERVAL=300
      # Nur Container mit Label updaten
      - WATCHTOWER_LABEL_ENABLE=true
      # Cleanup alte Images
      - WATCHTOWER_CLEANUP=true
      # Logs aktivieren
      - WATCHTOWER_DEBUG=false
      - WATCHTOWER_NOTIFICATIONS=shoutrrr
      # Optional: Notification URL (z.B. Discord Webhook)
      # - WATCHTOWER_NOTIFICATION_URL=discord://webhook_id/webhook_token
    command: --interval 300 --label-enable --cleanup
